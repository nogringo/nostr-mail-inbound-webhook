services:
  webhook:
    image: ghcr.io/nogringo/nostr-mail-inbound-webhook:latest
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      PORT: 8080
      DATA_DIR: /data
    volumes:
      - nostr-mail-inbound-data:/data

volumes:
  nostr-mail-inbound-data:
